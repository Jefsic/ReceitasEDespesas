<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despesas de Cartão - Gerenciador</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💳 Despesas de cartão</h1>
            <p>Cadastre, edite e acompanhe seus gastos parcelados</p>
        </header>

        <p class="section-label">➕ Nova despesa</p>
        <div class="card">
            <form id="formDespesa" onsubmit="return false;">
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="desc">Descrição *</label>
                        <input type="text" id="desc" placeholder="Ex: Supermercado, Netflix, Academia..." required>
                    </div>
                    <div class="form-group">
                        <label for="valor">Valor total (R$) *</label>
                        <input type="number" id="valor" placeholder="0,00" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="data">Data da 1ª parcela *</label>
                        <input type="date" id="data" required>
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoria *</label>
                        <select id="categoria" required>
                            <option value="">Selecione...</option>
                            <option>Alimentação</option>
                            <option>Transporte</option>
                            <option>Saúde</option>
                            <option>Lazer</option>
                            <option>Educação</option>
                            <option>Casa</option>
                            <option>Assinaturas</option>
                            <option>Roupas</option>
                            <option>Viagem</option>
                            <option>Outros</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="cartao">Cartão *</label>
                        <select id="cartao" required>
                            <option value="">Selecione...</option>
                            <option>Nubank</option>
                            <option>Itaú</option>
                            <option>Bradesco</option>
                            <option>Santander</option>
                            <option>Caixa</option>
                            <option>Inter</option>
                            <option>C6 Bank</option>
                            <option>XP</option>
                            <option>Outro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="parcelas">Parcelas</label>
                        <select id="parcelas">
                            <option value="1">1x (à vista)</option>
                            <option value="2">2x</option>
                            <option value="3">3x</option>
                            <option value="4">4x</option>
                            <option value="5">5x</option>
                            <option value="6">6x</option>
                            <option value="7">7x</option>
                            <option value="8">8x</option>
                            <option value="9">9x</option>
                            <option value="10">10x</option>
                            <option value="11">11x</option>
                            <option value="12">12x</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status">
                            <option value="pendente">Pendente</option>
                            <option value="pago">Pago</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="devedor">Devedor</label>
                        <select id="devedor">
                            <option value="Jefferson">Jefferson</option>
                            <option value="Erika">Erika</option>
                            <option value="Ambos">Ambos</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <button type="submit" class="btn-primary" onclick="addDespesa()">Adicionar despesa</button>
                    </div>
                </div>
            </form>
        </div>

        <p class="section-label">📋 Despesas cadastradas</p>

        <div class="toolbar">
            <button class="btn-outline" onclick="exportarJSON()">↓ Exportar JSON</button>
            <button class="btn-outline" onclick="document.getElementById('importInput').click()">↑ Importar JSON</button>
            <input type="file" id="importInput" accept=".json" style="display:none" onchange="importarJSON(event)">
        </div>

        <div class="summary">
            <div class="metric">
                <div class="metric-label">Total gasto</div>
                <div class="metric-value danger mono" id="total">R$ 0,00</div>
            </div>
            <div class="metric">
                <div class="metric-label">A pagar</div>
                <div class="metric-value mono" id="apagar">R$ 0,00</div>
            </div>
            <div class="metric">
                <div class="metric-label">Lançamentos</div>
                <div class="metric-value muted" id="count">0</div>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <colgroup>
                    <col style="width:21%">
                    <col class="col-cat" style="width:12%">
                    <col class="col-cart" style="width:11%">
                    <col style="width:11%">
                    <col style="width:10%">
                    <col style="width:10%">
                    <col style="width:10%">
                    <col style="width:10%">
                    <col style="width:5%">
                </colgroup>
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th class="col-cat">Categoria</th>
                        <th class="col-cart">Cartão</th>
                        <th>Valor</th>
                        <th>Vencimento</th>
                        <th>Parcela</th>
                        <th>Status</th>
                        <th>Devedor</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <tr>
                        <td colspan="9" class="empty">Nenhuma despesa cadastrada ainda.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal de Edição -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal()">&times;</span>
            <h2 style="margin-bottom: 1rem;">✏️ Editar Despesa</h2>
            <input type="hidden" id="editId">
            <div class="form-grid">
                <div class="form-group full">
                    <label>Descrição</label>
                    <input type="text" id="editDesc">
                </div>
                <div class="form-group">
                    <label>Valor (R$)</label>
                    <input type="number" id="editValor" step="0.01">
                </div>
                <div class="form-group">
                    <label>Data</label>
                    <input type="date" id="editData">
                </div>
                <div class="form-group">
                    <label>Categoria</label>
                    <select id="editCategoria">
                        <option>Alimentação</option>
                        <option>Transporte</option>
                        <option>Saúde</option>
                        <option>Lazer</option>
                        <option>Educação</option>
                        <option>Casa</option>
                        <option>Assinaturas</option>
                        <option>Roupas</option>
                        <option>Viagem</option>
                        <option>Outros</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Cartão</label>
                    <select id="editCartao">
                        <option>Nubank</option>
                        <option>Itaú</option>
                        <option>Bradesco</option>
                        <option>Santander</option>
                        <option>Caixa</option>
                        <option>Inter</option>
                        <option>C6 Bank</option>
                        <option>XP</option>
                        <option>Outro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="editStatus">
                        <option value="pendente">Pendente</option>
                        <option value="pago">Pago</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Devedor</label>
                    <select id="editDevedor">
                        <option>Jefferson</option>
                        <option>Erika</option>
                        <option>Ambos</option>
                    </select>
                </div>
                <div class="form-group full">
                    <button class="btn-primary" onclick="salvarEdicao()">Salvar Alterações</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const STORAGE_KEY = 'despesas_cartao_v2';
        const fmt = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        let despesas = [];

        function salvarLocal() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(despesas));
            } catch (e) {
                console.error('Erro ao salvar:', e);
            }
        }

        function carregarLocal() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) despesas = JSON.parse(raw);
            } catch (e) {
                despesas = [];
            }
        }

        function toast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2400);
        }

        function exportarJSON() {
            if (despesas.length === 0) {
                toast('Nenhuma despesa para exportar.');
                return;
            }
            const blob = new Blob([JSON.stringify(despesas, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `despesas_${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            toast('Exportado com sucesso!');
        }

        function importarJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const dados = JSON.parse(e.target.result);
                    if (!Array.isArray(dados)) throw new Error();
                    despesas = dados;
                    salvarLocal();
                    renderTabela();
                    renderSummary();
                    toast(`${dados.length} lançamento(s) importado(s).`);
                } catch {
                    toast('Arquivo inválido.');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function addDespesa() {
            const desc = document.getElementById('desc').value.trim();
            const valor = parseFloat(document.getElementById('valor').value);
            const data = document.getElementById('data').value;
            const categoria = document.getElementById('categoria').value;
            const cartao = document.getElementById('cartao').value;
            const parcelas = parseInt(document.getElementById('parcelas').value);
            const status = document.getElementById('status').value;
            const devedor = document.getElementById('devedor').value;

            if (!desc || !valor || !data || !categoria || !cartao) {
                toast('Preencha todos os campos obrigatórios.');
                return;
            }

            const valorParcela = parseFloat((valor / parcelas).toFixed(2));
            const [ano, mes, dia] = data.split('-').map(Number);
            const grupoId = Date.now();

            const novas = Array.from({ length: parcelas }, (_, i) => {
                const d = new Date(ano, mes - 1 + i, dia);
                const dataParc = [
                    d.getFullYear(),
                    String(d.getMonth() + 1).padStart(2, '0'),
                    String(d.getDate()).padStart(2, '0')
                ].join('-');
                return {
                    id: grupoId + i,
                    grupoId,
                    desc,
                    valor: valorParcela,
                    data: dataParc,
                    categoria,
                    cartao,
                    parcelaAtual: i + 1,
                    parcelaTotal: parcelas,
                    status,
                    devedor
                };
            });

            despesas.unshift(...novas);
            salvarLocal();
            renderTabela();
            renderSummary();

            document.getElementById('desc').value = '';
            document.getElementById('valor').value = '';
            document.getElementById('categoria').value = '';
            document.getElementById('cartao').value = '';
            document.getElementById('parcelas').value = '1';
            document.getElementById('status').value = 'pendente';

            const msg = parcelas === 1
                ? 'Despesa adicionada!'
                : `${parcelas} parcelas de ${fmt(valorParcela)} adicionadas!`;
            toast(msg);
        }

        function editarDespesa(id) {
            const despesa = despesas.find(d => d.id === id);
            if (!despesa) return;

            document.getElementById('editId').value = id;
            document.getElementById('editDesc').value = despesa.desc;
            document.getElementById('editValor').value = despesa.valor;
            document.getElementById('editData').value = despesa.data;
            document.getElementById('editCategoria').value = despesa.categoria;
            document.getElementById('editCartao').value = despesa.cartao;
            document.getElementById('editStatus').value = despesa.status;
            document.getElementById('editDevedor').value = despesa.devedor;

            document.getElementById('editModal').style.display = 'block';
        }

        function salvarEdicao() {
            const id = parseInt(document.getElementById('editId').value);
            const index = despesas.findIndex(d => d.id === id);
            
            if (index !== -1) {
                despesas[index] = {
                    ...despesas[index],
                    desc: document.getElementById('editDesc').value,
                    valor: parseFloat(document.getElementById('editValor').value),
                    data: document.getElementById('editData').value,
                    categoria: document.getElementById('editCategoria').value,
                    cartao: document.getElementById('editCartao').value,
                    status: document.getElementById('editStatus').value,
                    devedor: document.getElementById('editDevedor').value
                };
                
                salvarLocal();
                renderTabela();
                renderSummary();
                fecharModal();
                toast('Despesa atualizada com sucesso!');
            }
        }

        function fecharModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function deleteDespesa(id) {
            const d = despesas.find(x => x.id === id);
            if (!d) return;
            
            if (d.parcelaTotal > 1) {
                const todas = confirm(
                    `Esta despesa tem ${d.parcelaTotal} parcelas.\n\nOK = remover todas as parcelas\nCancelar = remover só esta parcela`
                );
                despesas = todas
                    ? despesas.filter(x => x.grupoId !== d.grupoId)
                    : despesas.filter(x => x.id !== id);
            } else {
                if (!confirm('Remover esta despesa?')) return;
                despesas = despesas.filter(x => x.id !== id);
            }
            salvarLocal();
            renderTabela();
            renderSummary();
            toast('Removido com sucesso.');
        }

        function renderTabela() {
            const tbody = document.getElementById('tbody');
            if (despesas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="empty">Nenhuma despesa cadastrada ainda.</td></tr>';
                return;
            }
            
            tbody.innerHTML = despesas.map(d => {
                const [y, m, day] = d.data.split('-');
                const dataFmt = `${day}/${m}/${y}`;
                const parcLabel = d.parcelaTotal === 1
                    ? '<span style="color:var(--text-faint);font-size:12px">à vista</span>'
                    : `<span class="parc-pill">${d.parcelaAtual}/${d.parcelaTotal}</span>`;
                const badge = d.status === 'pago'
                    ? '<span class="badge badge-pago">pago</span>'
                    : '<span class="badge badge-pendente">pendente</span>';
                return `<tr>
                    <td style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${d.desc}">${d.desc}</td>
                    <td class="col-cat"><span class="cat-pill">${d.categoria}</span></td>
                    <td class="col-cart" style="color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.cartao}</td>
                    <td class="mono" style="font-weight:500">${fmt(d.valor)}</td>
                    <td style="color:var(--text-muted)">${dataFmt}</td>
                    <td>${parcLabel}</td>
                    <td>${badge}</td>
                    <td style="color:var(--text-muted)">${d.devedor || '—'}</td>
                    <td>
                        <button class="btn-edit" onclick="editarDespesa(${d.id})" title="Editar">✏️</button>
                        <button class="btn-del" onclick="deleteDespesa(${d.id})" title="Remover">×</button>
                    </td>
                </tr>`;
            }).join('');
        }

        function renderSummary() {
            const total = despesas.reduce((s, d) => s + d.valor, 0);
            const apagar = despesas.filter(d => d.status === 'pendente').reduce((s, d) => s + d.valor, 0);
            document.getElementById('total').textContent = fmt(total);
            document.getElementById('apagar').textContent = fmt(apagar);
            document.getElementById('count').textContent = despesas.length;
        }

        // Fechar modal ao clicar fora
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target === modal) {
                fecharModal();
            }
        }

        // Inicialização
        document.getElementById('data').valueAsDate = new Date();
        carregarLocal();
        renderTabela();
        renderSummary();
    </script>
</body>
</html>
