<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Despesas de Cartão</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: #e2e0d8;
      --border-strong: #c8c6bc;
      --text: #1a1a18;
      --text-muted: #6b6a65;
      --text-faint: #a09f9a;
      --accent: #1a1a18;
      --danger: #c0392b;
      --danger-bg: #fdf0ee;
      --success: #1a7a4a;
      --success-bg: #edf7f2;
      --warning: #b35c00;
      --warning-bg: #fef5e7;
      --radius: 10px;
      --radius-sm: 6px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 960px; margin: 0 auto; }

    header { margin-bottom: 2.5rem; }
    header h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.3px; }
    header p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    .section-label {
      font-size: 11px; font-weight: 500; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-faint); margin-bottom: 10px;
    }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem; margin-bottom: 2rem;
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }

    label { font-size: 12px; font-weight: 500; color: var(--text-muted); }

    input, select {
      font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text);
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 9px 12px; outline: none;
      transition: border-color 0.15s; width: 100%;
    }
    input:focus, select:focus { border-color: var(--border-strong); background: #fff; }
    input::placeholder { color: var(--text-faint); }

    .btn-primary {
      width: 100%; padding: 11px; background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; margin-top: 4px;
    }
    .btn-primary:hover { opacity: 0.82; }
    .btn-primary:active { opacity: 0.65; }

    .toolbar { display: flex; gap: 8px; margin-bottom: 1.25rem; }

    .btn-outline {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
      color: var(--text); cursor: pointer; transition: background 0.12s, border-color 0.12s;
    }
    .btn-outline:hover { background: var(--bg); border-color: var(--border-strong); }

    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.5rem; }

    .metric {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 18px;
    }
    .metric-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .metric-value { font-size: 22px; font-weight: 500; }
    .metric-value.danger { color: var(--danger); }
    .metric-value.muted { font-size: 18px; color: var(--text-muted); }

    .table-wrap {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; }

    th {
      font-size: 11px; font-weight: 500; color: var(--text-faint); text-align: left;
      padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--bg);
      text-transform: uppercase; letter-spacing: 0.05em;
    }

    td {
      font-size: 13px; padding: 11px 14px;
      border-bottom: 1px solid var(--border); vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafaf8; }

    .badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 20px; }
    .badge-pago { background: var(--success-bg); color: var(--success); }
    .badge-pendente { background: var(--warning-bg); color: var(--warning); }

    .cat-pill {
      display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 20px;
      background: var(--bg); color: var(--text-muted); border: 1px solid var(--border);
    }

    .parc-pill {
      display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 9px;
      border-radius: 20px; background: #ede9fe; color: #5b21b6;
    }

    .mono { font-family: 'DM Mono', monospace; font-size: 13px; }

    .btn-del {
      background: none; border: none; color: var(--text-faint); cursor: pointer;
      font-size: 18px; line-height: 1; padding: 3px 7px; border-radius: var(--radius-sm);
      transition: color 0.1s, background 0.1s;
    }
    .btn-del:hover { color: var(--danger); background: var(--danger-bg); }

    .empty { text-align: center; color: var(--text-faint); font-size: 13px; padding: 3rem 0; }

    .toast {
      position: fixed; bottom: 2rem; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--text); color: #fff; font-size: 13px;
      padding: 9px 20px; border-radius: 20px; opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none; white-space: nowrap; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
      .summary { grid-template-columns: 1fr 1fr; }
      .col-cat, .col-cart { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">

    <header>
      <h1>Despesas de cartão</h1>
      <p>Cadastre e acompanhe seus gastos por cartão de crédito</p>
    </header>

    <p class="section-label">Nova despesa</p>
    <div class="card">
      <div class="form-grid">
        <div class="form-group full">
          <label for="desc">Descrição</label>
          <input type="text" id="desc" placeholder="Ex: Supermercado, Netflix, Academia...">
        </div>
        <div class="form-group">
          <label for="valor">Valor total (R$)</label>
          <input type="number" id="valor" placeholder="0,00" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label for="data">Data da 1ª parcela</label>
          <input type="date" id="data">
        </div>
        <div class="form-group">
          <label for="categoria">Categoria</label>
          <select id="categoria">
            <option value="">Selecione...</option>
            <option>Alimentação</option><option>Transporte</option><option>Saúde</option>
            <option>Lazer</option><option>Educação</option><option>Casa</option>
            <option>Assinaturas</option><option>Roupas</option><option>Viagem</option><option>Outros</option>
          </select>
        </div>
        <div class="form-group">
          <label for="cartao">Cartão</label>
          <select id="cartao">
            <option value="">Selecione...</option>
            <option>Nubank</option><option>Itaú</option><option>Bradesco</option>
            <option>Santander</option><option>Caixa</option><option>Inter</option>
            <option>C6 Bank</option><option>XP</option><option>Outro</option>
          </select>
        </div>
        <div class="form-group">
          <label for="parcelas">Parcelas</label>
          <select id="parcelas">
            <option value="1">1x (à vista)</option>
            <option value="2">2x</option><option value="3">3x</option><option value="4">4x</option>
            <option value="5">5x</option><option value="6">6x</option><option value="7">7x</option>
            <option value="8">8x</option><option value="9">9x</option><option value="10">10x</option>
            <option value="11">11x</option><option value="12">12x</option>
          </select>
        </div>
        <div class="form-group">
          <label for="status">Status</label>
          <select id="status">
            <option value="pendente">Pendente</option>
            <option value="pago">Pago</option>
          </select>
        </div>
        <div class="form-group">
          <label for="devedor">Devedor</label>
          <select id="devedor">
            <option value="Jefferson">Jefferson</option>
            <option value="Erika">Erika</option>
            <option value="Ambos">Ambos</option>
          </select>
        </div>
        <div class="form-group full">
          <button class="btn-primary" onclick="addDespesa()">Adicionar despesa</button>
        </div>
      </div>
    </div>

    <p class="section-label">Despesas cadastradas</p>

    <div class="toolbar">
      <button class="btn-outline" onclick="exportarJSON()">↓ Exportar JSON</button>
      <button class="btn-outline" onclick="document.getElementById('importInput').click()">↑ Importar JSON</button>
      <input type="file" id="importInput" accept=".json" style="display:none" onchange="importarJSON(event)">
    </div>

    <div class="summary">
      <div class="metric">
        <div class="metric-label">Total gasto</div>
        <div class="metric-value danger mono" id="total">R$ 0,00</div>
      </div>
      <div class="metric">
        <div class="metric-label">A pagar</div>
        <div class="metric-value mono" id="apagar">R$ 0,00</div>
      </div>
      <div class="metric">
        <div class="metric-label">Lançamentos</div>
        <div class="metric-value muted" id="count">0</div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <colgroup>
          <col style="width:21%">
          <col class="col-cat" style="width:12%">
          <col class="col-cart" style="width:11%">
          <col style="width:11%">
          <col style="width:10%">
          <col style="width:10%">
          <col style="width:10%">
          <col style="width:10%">
          <col style="width:5%">
        </colgroup>
        <thead>
          <tr>
            <th>Descrição</th>
            <th class="col-cat">Categoria</th>
            <th class="col-cart">Cartão</th>
            <th>Valor</th>
            <th>Vencimento</th>
            <th>Parcela</th>
            <th>Status</th>
            <th>Devedor</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="9" class="empty">Nenhuma despesa cadastrada ainda.</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'despesas_cartao_v2';
    const fmt = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    let despesas = [];

    function salvarLocal() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(despesas)); } catch(e) {}
    }

    function carregarLocal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) despesas = JSON.parse(raw);
      } catch(e) { despesas = []; }
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2400);
    }

    function exportarJSON() {
      if (despesas.length === 0) { toast('Nenhuma despesa para exportar.'); return; }
      const blob = new Blob([JSON.stringify(despesas, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `despesas_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast('Exportado com sucesso!');
    }

    function importarJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const dados = JSON.parse(e.target.result);
          if (!Array.isArray(dados)) throw new Error();
          despesas = dados;
          salvarLocal();
          renderTabela();
          renderSummary();
          toast(`${dados.length} lançamento(s) importado(s).`);
        } catch { toast('Arquivo inválido.'); }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    function addDespesa() {
      const desc      = document.getElementById('desc').value.trim();
      const valor     = parseFloat(document.getElementById('valor').value);
      const data      = document.getElementById('data').value;
      const categoria = document.getElementById('categoria').value;
      const cartao    = document.getElementById('cartao').value;
      const parcelas  = parseInt(document.getElementById('parcelas').value);
      const status    = document.getElementById('status').value;
      const devedor   = document.getElementById('devedor').value;

      if (!desc || !valor || !data || !categoria || !cartao) {
        toast('Preencha todos os campos obrigatórios.'); return;
      }

      const valorParcela = parseFloat((valor / parcelas).toFixed(2));
      const [ano, mes, dia] = data.split('-').map(Number);
      const grupoId = Date.now();

      const novas = Array.from({ length: parcelas }, (_, i) => {
        const d = new Date(ano, mes - 1 + i, dia);
        const dataParc = [
          d.getFullYear(),
          String(d.getMonth() + 1).padStart(2, '0'),
          String(d.getDate()).padStart(2, '0')
        ].join('-');
        return {
          id: grupoId + i,
          grupoId,
          desc,
          valor: valorParcela,
          data: dataParc,
          categoria,
          cartao,
          parcelaAtual: i + 1,
          parcelaTotal: parcelas,
          status,
          devedor
        };
      });

      despesas.unshift(...novas);
      salvarLocal();
      renderTabela();
      renderSummary();

      document.getElementById('desc').value = '';
      document.getElementById('valor').value = '';
      document.getElementById('categoria').value = '';
      document.getElementById('cartao').value = '';
      document.getElementById('parcelas').value = '1';
      document.getElementById('status').value = 'pendente';

      const msg = parcelas === 1
        ? 'Despesa adicionada!'
        : `${parcelas} parcelas de ${fmt(valorParcela)} adicionadas!`;
      toast(msg);
    }

    function deleteDespesa(id) {
      const d = despesas.find(x => x.id === id);
      if (!d) return;
      if (d.parcelaTotal > 1) {
        const todas = confirm(
          `Esta despesa tem ${d.parcelaTotal} parcelas.\n\nOK = remover todas as parcelas\nCancelar = remover só esta parcela`
        );
        despesas = todas
          ? despesas.filter(x => x.grupoId !== d.grupoId)
          : despesas.filter(x => x.id !== id);
      } else {
        if (!confirm('Remover esta despesa?')) return;
        despesas = despesas.filter(x => x.id !== id);
      }
      salvarLocal();
      renderTabela();
      renderSummary();
      toast('Removido.');
    }

    function renderTabela() {
      const tbody = document.getElementById('tbody');
      if (despesas.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="empty">Nenhuma despesa cadastrada ainda.</td></tr>';
        return;
      }
      tbody.innerHTML = despesas.map(d => {
        const [y, m, day] = d.data.split('-');
        const dataFmt = `${day}/${m}/${y}`;
        const parcLabel = d.parcelaTotal === 1
          ? '<span style="color:var(--text-faint);font-size:12px">à vista</span>'
          : `<span class="parc-pill">${d.parcelaAtual}/${d.parcelaTotal}</span>`;
        const badge = d.status === 'pago'
          ? '<span class="badge badge-pago">pago</span>'
          : '<span class="badge badge-pendente">pendente</span>';
        return `<tr>
          <td style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${d.desc}">${d.desc}</td>
          <td class="col-cat"><span class="cat-pill">${d.categoria}</span></td>
          <td class="col-cart" style="color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.cartao}</td>
          <td class="mono" style="font-weight:500">${fmt(d.valor)}</td>
          <td style="color:var(--text-muted)">${dataFmt}</td>
          <td>${parcLabel}</td>
          <td>${badge}</td>
          <td style="color:var(--text-muted)">${d.devedor || '—'}</td>
          <td><button class="btn-del" onclick="deleteDespesa(${d.id})" title="Remover">×</button></td>
        </tr>`;
      }).join('');
    }

    function renderSummary() {
      const total  = despesas.reduce((s, d) => s + d.valor, 0);
      const apagar = despesas.filter(d => d.status === 'pendente').reduce((s, d) => s + d.valor, 0);
      document.getElementById('total').textContent  = fmt(total);
      document.getElementById('apagar').textContent = fmt(apagar);
      document.getElementById('count').textContent  = despesas.length;
    }

    document.getElementById('data').valueAsDate = new Date();
    carregarLocal();
    renderTabela();
    renderSummary();
  </script>
</body>
</html>
