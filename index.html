<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despesas dos cartões de crédito - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💳 Gerenciamento de despesas com Cartão de Crédito</h1>
            <p>Dashboard de gastos por cartão de crédito</p>
        </header>

        <!-- Filtro de Faturas -->
        <div class="filter-bar" style="margin-bottom: 1.5rem;">
            <div class="filter-group" style="flex: 1;">
                <label>📆 Totais das próximas faturas (vencimento dia 20):</label>
                <select id="filtroFatura" class="filter-select">
                    <option value="0">Selecione um mês...</option>
                </select>
            </div>
        </div>

        <div id="dashboard"></div>

        <a href="DespesasCartaoCredito.html" class="nav-link">
            ✏️ Gerenciar Lançamentos →
        </a>
    </div>

    <!-- Modal para exibir despesas do cartão -->
    <div id="modalDespesas" class="despesas-modal">
        <div class="despesas-modal-content">
            <div class="despesas-modal-header">
                <h2 id="modalTitulo">💳 Despesas do Cartão</h2>
                <span class="close-modal" onclick="fecharModalDespesas()">&times;</span>
            </div>
            <div id="modalBody" class="despesas-list">
                <!-- Conteúdo dinâmico -->
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="shared.js"></script>
    <script>
        const STORAGE_KEY = 'despesas_cartao_v2';
        const fmt = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        // Função para obter a próxima data de fatura (sempre dia 20)
        function getProximaDataFatura() {
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);
            let dataFatura = new Date(hoje.getFullYear(), hoje.getMonth(), 20);
            if (hoje.getDate() > 20) {
                dataFatura.setMonth(dataFatura.getMonth() + 1);
            }
            return dataFatura;
        }

        // Função para formatar o nome do mês
        function formatarMesFatura(mesesAdicionais) {
            const dataFaturaBase = getProximaDataFatura();
            const data = new Date(dataFaturaBase);
            data.setMonth(data.getMonth() + mesesAdicionais);
            return data.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
        }

        // Função para obter a data da fatura (sempre dia 20)
        function getDataFatura(mesesAdicionais) {
            const dataFaturaBase = getProximaDataFatura();
            const data = new Date(dataFaturaBase);
            data.setMonth(data.getMonth() + mesesAdicionais);
            data.setHours(0, 0, 0, 0);
            return data;
        }

        function toast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2400);
        }

        function carregarDados() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) {
                    document.getElementById('dashboard').innerHTML = 
                        '<p style="text-align:center; padding: 2rem;">Nenhum dado encontrado. <br> <a href="DespesasCartaoCredito.html" style="color: var(--accent);">Clique aqui para adicionar despesas</a></p>';
                    return;
                }

                let todasDespesas = JSON.parse(raw);
                
                let despesas = todasDespesas;
                
                const filtroFatura = document.getElementById('filtroFatura').value;
                const meses = parseInt(filtroFatura);
                
                if (meses >= 0) {
                    const dataFatura = getDataFatura(meses);
                    const dataFaturaInicio = new Date(dataFatura);
                    dataFaturaInicio.setDate(1);
                    dataFaturaInicio.setHours(0, 0, 0, 0);
                    
                    const dataFaturaFim = new Date(dataFatura);
                    dataFaturaFim.setMonth(dataFaturaFim.getMonth() + 1);
                    dataFaturaFim.setDate(0);
                    dataFaturaFim.setHours(23, 59, 59, 999);
                    
                    despesas = despesas.filter(d => {
                        const dataVencimento = new Date(d.data);
                        return dataVencimento >= dataFaturaInicio && dataVencimento <= dataFaturaFim;
                    });
                }
                
                renderizarResumo(despesas, meses);
                
                if (despesas.length === 0 && meses >= 0) {
                    const mesNome = formatarMesFatura(meses);
                    toast(`Nenhuma despesa para a fatura de ${mesNome}.`);
                }
                
            } catch (error) {
                console.error(error);
                toast("Erro ao carregar dados do localStorage");
            }
        }

        function abrirModalDespesas(cartaoNome, despesasFiltradas, meses) {
            const modal = document.getElementById('modalDespesas');
            const titulo = document.getElementById('modalTitulo');
            const body = document.getElementById('modalBody');
            
            let subtitulo = '';
            if (meses >= 0) {
                const mesNome = formatarMesFatura(meses);
                subtitulo = `<span style="font-size: 14px; color: var(--text-muted); display: block; margin-top: 5px;">Fatura de ${mesNome}</span>`;
            }
            
            titulo.innerHTML = `💳 ${cartaoNome}${subtitulo}`;
            
            if (despesasFiltradas.length === 0) {
                body.innerHTML = '<p style="text-align:center; padding: 2rem;">Nenhuma despesa encontrada para este cartão.</p>';
            } else {
                const totalCartao = despesasFiltradas.reduce((sum, d) => sum + d.valor, 0);
                
                body.innerHTML = `
                    ${despesasFiltradas.map(d => {
                        const [y, m, day] = d.data.split('-');
                        const dataFmt = `${day}/${m}/${y}`;
                        const dataCompraFmt = d.dataCompra ? (() => {
                            const [yc, mc, dc] = d.dataCompra.split('-');
                            return `${dc}/${mc}/${yc}`;
                        })() : '—';
                        const parcLabel = d.parcelaTotal === 1
                            ? 'À vista'
                            : `${d.parcelaAtual}/${d.parcelaTotal}`;
                        const recorrenteIcon = d.despRecorrente ? ' 🔄' : '';
                        
                        return `
                            <div class="despesa-item">
                                <div class="despesa-item-header">
                                    <span class="despesa-desc">${d.desc}${recorrenteIcon}</span>
                                    <span class="despesa-valor">${fmt(d.valor)}</span>
                                </div>
                                <div class="despesa-details">
                                    <span>📅 Compra: ${dataCompraFmt}</span>
                                    <span>📆 Vencimento: ${dataFmt}</span>
                                    <span>📦 ${parcLabel}</span>
                                    <span>🏷️ ${d.categoria}</span>
                                    <span>👤 ${d.devedor || '—'}</span>
                                </div>
                            </div>
                        `;
                    }).join('')}
                    <div class="modal-total">
                        <strong>💰 Total no cartão ${cartaoNome}:</strong>
                        <span class="total-valor">${fmt(totalCartao)}</span>
                    </div>
                `;
            }
            
            modal.style.display = 'block';
        }

        function fecharModalDespesas() {
            document.getElementById('modalDespesas').style.display = 'none';
        }

        function renderizarResumo(despesas, mesesSelecionados = 0) {
            const dashboard = document.getElementById('dashboard');
            
            if (despesas.length === 0) {
                dashboard.innerHTML = `
                    <div style="text-align:center; padding: 2rem; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);">
                        <p>Nenhuma despesa encontrada.</p>
                        <p style="font-size: 12px; color: var(--text-muted); margin-top: 10px;">
                            ${mesesSelecionados >= 0 ? 'Não há despesas programadas para esta fatura.' : 'Adicione despesas no gerenciador.'}
                        </p>
                    </div>
                `;
                return;
            }
            
            // Agrupar por cartão
            const resumo = {};
            let totalGeral = 0;
            
            despesas.forEach(item => {
                const nomeCartao = item.cartao || "Outros";
                const valorNumerico = parseFloat(item.valor) || 0;
                
                if (!resumo[nomeCartao]) {
                    resumo[nomeCartao] = {
                        total: 0,
                        itens: []
                    };
                }
                resumo[nomeCartao].total += valorNumerico;
                resumo[nomeCartao].itens.push(item);
                totalGeral += valorNumerico;
            });
            
            // Título do período
            let tituloPeriodo = '';
            if (mesesSelecionados >= 0) {
                const mesNome = formatarMesFatura(mesesSelecionados);
                const dataFatura = getDataFatura(mesesSelecionados);
                const dataFormatada = dataFatura.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                tituloPeriodo = `<div style="margin-bottom: 1rem; padding: 0.75rem; background: var(--bg); border-radius: var(--radius-sm); text-align: center;">
                    <strong>📆 Fatura de ${mesNome}</strong> (vencimento: ${dataFormatada})
                </div>`;
            }
            
            // Criar card de total geral
            const totalCard = document.createElement('div');
            totalCard.className = 'card-summary';
            totalCard.style.background = 'var(--accent)';
            totalCard.style.color = 'white';
            totalCard.style.marginBottom = '1.5rem';
            totalCard.innerHTML = `
                <strong style="font-size: 16px;">💰 Total ${mesesSelecionados >= 0 ? 'da fatura' : 'das despesas'}</strong>
                <span style="font-size: 24px; font-weight: 700;">${fmt(totalGeral)}</span>
            `;
            dashboard.innerHTML = tituloPeriodo;
            dashboard.appendChild(totalCard);
            
            // Criar cards por cartão
            const cartoesEncontrados = Object.keys(resumo).sort();
            
            cartoesEncontrados.forEach(cartao => {
                const div = document.createElement('div');
                div.className = 'card-summary';
                div.innerHTML = `
                    <button class="btn-cartao" data-cartao="${cartao}">${cartao}</button>
                    <span class="valor-soma">${fmt(resumo[cartao].total)}</span>
                `;
                
                const btn = div.querySelector('.btn-cartao');
                btn.addEventListener('click', () => {
                    abrirModalDespesas(cartao, resumo[cartao].itens, mesesSelecionados);
                });
                
                dashboard.appendChild(div);
            });
        }

        // Atualizar as opções do select com os meses dinâmicos
        function atualizarOpcoesSelect() {
            const select = document.getElementById('filtroFatura');
            const hoje = new Date();
            const diaAtual = hoje.getDate();
            
            let options = [
                '<option value="">Selecione um mês...</option>'
            ];
            
            for (let i = 0; i < 6; i++) {
                const dataFatura = getDataFatura(i);
                const mesNome = dataFatura.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
                const dataFormatada = dataFatura.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                
                let prefixo = '';
                if (i === 0) {
                    if (diaAtual <= 20) {
                        prefixo = '⭐ PRÓXIMA - ';
                    } else {
                        prefixo = '📅 PRÓXIMA - ';
                    }
                } else if (i === 1 && diaAtual > 20) {
                    prefixo = '⭐ PRÓXIMA - ';
                }
                
                options.push(`<option value="${i}">${prefixo}Fatura ${dataFormatada} (${mesNome})</option>`);
            }
            
            select.innerHTML = options.join('');
            
            if (options.length > 1) {
                select.value = "0";
                carregarDados();
            }
        }

        // Fechar modal ao clicar fora
        window.onclick = function(event) {
            const modal = document.getElementById('modalDespesas');
            if (event.target === modal) {
                fecharModalDespesas();
            }
        }

        // Inicialização
        atualizarOpcoesSelect();
    </script>
</body>
</html>
